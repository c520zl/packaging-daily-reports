name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ===== 后端：编译 + 测试 =====
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile & test
        working-directory: server
        run: mvn -B package -DskipTests=false --file pom.xml

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/*.jar
          retention-days: 3

  # ===== 前端：类型检查 + 构建 =====
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 类型检查 + 构建（vue-tsc -b && vite build）
      - name: Type-check & build
        working-directory: web
        run: pnpm run build

