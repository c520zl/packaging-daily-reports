name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 生产镜像发布：构建 → 推 GHCR →（可选）SSH 到服务器执行 compose 拉取重启
jobs:
  release:
    name: Build & release images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME:-main}" >> $GITHUB_OUTPUT

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===== 可选：自动部署到服务器（配置以下 secrets 后启用）=====
      # SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY
      - name: Deploy over SSH
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/packaging-daily-reports
            docker compose pull server web
            docker compose up -d --force-recreate server web
            docker image prune -f
