# ===== 开发环境配置（本地 mvn spring-boot:run 时启用：--spring.profiles.active=dev）=====
# 生产环境走 compose 环境变量注入，不使用本文件
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/daily_report?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root

app:
  jwt:
    # 开发默认密钥（仅限本地开发；生产必须用环境变量注入并定期轮换）
    secret: "dev-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef=="
    expire-hours: 24

storage:
  rustfs:
    endpoint: http://localhost:9000
    access-key: rustfsadmin
    secret-key: rustfsadmin
    bucket: daily-report
    public-url: http://localhost:9000

logging:
  level:
    com.factory.report: debug