<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="app">
<title>我的 · 软包装生产日报表系统</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mobile.css">
<style>
  .me-profile {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 16px;
  }
  .me-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.3);
    display: grid; place-items: center;
    font-size: 20px; font-weight: 600;
    flex-shrink: 0;
  }
  .me-name { font-size: 18px; font-weight: 600; }
  .me-dept { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 4px; }
  .me-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    margin: 12px 16px 0;
    padding: 14px 0;
    box-shadow: var(--shadow-sm);
  }
  .me-stat { text-align: center; }
  .me-stat + .me-stat { border-left: 1px solid var(--line); }
  .me-stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .me-stat .k { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="m-head">
    <div class="me-profile">
      <div class="me-avatar">李</div>
      <div>
        <div class="me-name">李明</div>
        <div class="me-dept">印刷部 · 普通员工 · 工号 YS-02</div>
      </div>
    </div>
  </header>

  <!-- 本月统计 -->
  <div class="me-stats">
    <div class="me-stat"><div class="v">86</div><div class="k">本月填报行数</div></div>
    <div class="me-stat"><div class="v">31,420</div><div class="k">本月印刷米数</div></div>
    <div class="me-stat"><div class="v">3</div><div class="k">被退回</div></div>
  </div>

  <main class="m-body" style="margin-top:12px">
    <!-- 账号设置 -->
    <section class="m-card">
      <div class="m-card-head"><div class="m-card-title">账号与安全</div></div>
      <div class="m-card-body" style="padding:0">
        <a class="m-me-cell" href="m-profile.html">
          <svg width="18" height="18"><use href="icons.svg#i-users"></use></svg>
          个人资料
          <span class="m-me-val">李明 · 男 · 138 0000 0003</span>
        </a>
        <a class="m-me-cell" href="m-profile.html">
          <svg width="18" height="18"><use href="icons.svg#i-shield"></use></svg>
          修改密码
          <svg class="m-me-val" width="14" height="14" style="color:var(--muted-2)"><use href="icons.svg#i-arrow-right"></use></svg>
        </a>
        <div class="m-me-cell">
          <svg width="18" height="18"><use href="icons.svg#i-bell"></use></svg>
          审核通知
          <span class="m-me-val">已开启</span>
        </div>
      </div>
    </section>

    <!-- 帮助 -->
    <section class="m-card">
      <div class="m-card-head"><div class="m-card-title">帮助</div></div>
      <div class="m-card-body" style="padding:0">
        <div class="m-me-cell">
          <svg width="18" height="18"><use href="icons.svg#i-report"></use></svg>
          填报说明（车间规范）
          <svg class="m-me-val" width="14" height="14" style="color:var(--muted-2)"><use href="icons.svg#i-arrow-right"></use></svg>
        </div>
        <div class="m-me-cell">
          <svg width="18" height="18"><use href="icons.svg#i-edit"></use></svg>
          意见反馈
          <svg class="m-me-val" width="14" height="14" style="color:var(--muted-2)"><use href="icons.svg#i-arrow-right"></use></svg>
        </div>
        <div class="m-me-cell">
          <svg width="18" height="18"><use href="icons.svg#i-logout"></use></svg>
          退出登录
          <span class="m-me-val" style="color:var(--danger)">退出</span>
        </div>
      </div>
    </section>

    <p class="m-card-sub" style="text-align:center">软包装生产日报表系统 v1.0</p>
  </main>

  <!-- 底部标签栏 -->
  <nav class="m-tabbar">
    <a class="m-tab" href="m-home.html">
      <svg width="22" height="22"><use href="icons.svg#i-dashboard"></use></svg>
      首页
    </a>
    <a class="m-tab" href="m-print.html">
      <span class="m-fab"><svg width="22" height="22"><use href="icons.svg#i-plus"></use></svg></span>
    </a>
    <a class="m-tab on" href="m-me.html">
      <svg width="22" height="22"><use href="icons.svg#i-users"></use></svg>
      我的
    </a>
  </nav>
</div>
</body>
</html>
