<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="web">
<title>复合部日报 · 软包装生产日报表系统</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">包</div>
      <div class="brand-name">生产日报表</div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><svg width="18" height="18"><use href="icons.svg#i-dashboard"></use></svg>工作台</a>
      <div class="nav-group">日报填报</div>
      <a class="nav-item" href="print.html"><svg width="18" height="18"><use href="icons.svg#i-print"></use></svg>印刷部日报</a>
      <a class="nav-item active" href="lamination.html"><svg width="18" height="18"><use href="icons.svg#i-layers"></use></svg>复合部日报</a>
      <a class="nav-item" href="bagmaking.html"><svg width="18" height="18"><use href="icons.svg#i-bag"></use></svg>制袋部日报</a>
      <div class="nav-group">数据管理</div>
      <a class="nav-item" href="reports.html"><svg width="18" height="18"><use href="icons.svg#i-report"></use></svg>报表查询</a>
      <a class="nav-item" href="users.html"><svg width="18" height="18"><use href="icons.svg#i-users"></use></svg>用户管理</a>
    </nav>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-title">复合部日报表</div>
      <div class="topbar-right">
        <span class="tag tag-blue"><span class="dot"></span>待审核 1 行</span>
        <div class="topbar-user">
          <div class="avatar">王</div>
          <span class="topbar-username">王班长 · 复合部</span>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="card">
        <div class="card-head">
          <div>
            <div class="card-title">公共信息</div>
            <div class="card-sub">日报日期与当班信息，整表共用</div>
          </div>
        </div>
        <div class="card-body filter-bar">
          <div class="field" style="min-width:180px">
            <label class="field-label">日期<span class="req">*</span></label>
            <input class="input" type="date" value="2026-11-23">
          </div>
          <div class="field" style="min-width:150px">
            <label class="field-label">当班班长</label>
            <input class="input" type="text" value="王建军">
          </div>
          <div class="field" style="min-width:160px">
            <label class="field-label">机型筛选</label>
            <select class="select"><option selected>干式 + 无溶剂</option><option>干式</option><option>无溶剂</option></select>
          </div>
          <div class="toolbar" style="margin-left:auto">
            <button class="btn btn-outline"><svg width="15" height="15"><use href="icons.svg#i-download"></use></svg>导出今日</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <div class="card-title">明细记录 <span class="card-sub">共 4 行</span></div>
          </div>
          <div class="card-actions">
            <button class="btn btn-outline btn-sm"><svg width="14" height="14"><use href="icons.svg#i-plus"></use></svg>添加一行</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="tbl form-table">
            <thead>
              <tr>
                <th style="width:112px">生产单号<i style="color:var(--danger)">*</i></th>
                <th style="width:64px">次数</th>
                <th style="width:84px">机速<br>m/min</th>
                <th style="width:110px">材质</th>
                <th style="width:120px">规格</th>
                <th style="width:104px">工单要求<br>米数</th>
                <th style="width:104px">实际复合<br>米数</th>
                <th style="width:64px">卷数</th>
                <th style="width:88px">印刷剩余<br>米数</th>
                <th style="width:96px">机型<i style="color:var(--danger)">*</i></th>
                <th style="width:88px">调机米数</th>
                <th style="width:80px">签名</th>
                <th style="width:44px"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input class="cell-input" value="FH-20261123-01"></td>
                <td><input class="cell-input num" value="2"></td>
                <td><input class="cell-input num" value="130"></td>
                <td><input class="cell-input" value="PET/AL/PE"></td>
                <td><input class="cell-input" value="360×240"></td>
                <td><input class="cell-input num" value="3600"></td>
                <td><input class="cell-input num" value="3560"></td>
                <td><input class="cell-input num" value="12"></td>
                <td><input class="cell-input num" value="240"></td>
                <td>
                  <select class="cell-select"><option>干式</option><option selected>无溶剂</option></select>
                </td>
                <td><input class="cell-input num" value="120"></td>
                <td><input class="cell-input" value="王建军"></td>
                <td><button class="row-del" title="删除该行"><svg width="15" height="15"><use href="icons.svg#i-trash"></use></svg></button></td>
              </tr>
              <tr>
                <td><input class="cell-input" value="FH-20261123-02"></td>
                <td><input class="cell-input num" value="1"></td>
                <td><input class="cell-input num" value="95"></td>
                <td><input class="cell-input" value="PET/VMPET/CPP"></td>
                <td><input class="cell-input" value="420×300"></td>
                <td><input class="cell-input num" value="4400"></td>
                <td><input class="cell-input num" value="4350"></td>
                <td><input class="cell-input num" value="15"></td>
                <td><input class="cell-input num" value="0"></td>
                <td>
                  <select class="cell-select" selected><option selected>干式</option><option>无溶剂</option></select>
                </td>
                <td><input class="cell-input num" value="210"></td>
                <td><input class="cell-input" value="王建军"></td>
                <td><button class="row-del" title="删除该行"><svg width="15" height="15"><use href="icons.svg#i-trash"></use></svg></button></td>
              </tr>
              <tr>
                <td><input class="cell-input" value="FH-20261123-03"></td>
                <td><input class="cell-input num" value="3"></td>
                <td><input class="cell-input num" value="120"></td>
                <td><input class="cell-input" value="PET/PE"></td>
                <td><input class="cell-input" value="350×220"></td>
                <td><input class="cell-input num" value="2900"></td>
                <td><input class="cell-input num" value="2860"></td>
                <td><input class="cell-input num" value="10"></td>
                <td><input class="cell-input num" value="40"></td>
                <td>
                  <select class="cell-select"><option>干式</option><option selected>无溶剂</option></select>
                </td>
                <td><input class="cell-input num" value="90"></td>
                <td><input class="cell-input" value="刘伟"></td>
                <td><button class="row-del" title="删除该行"><svg width="15" height="15"><use href="icons.svg#i-trash"></use></svg></button></td>
              </tr>
              <tr>
                <td><input class="cell-input" value="FH-20261123-04"></td>
                <td><input class="cell-input num" value="2"></td>
                <td><input class="cell-input num" value="" placeholder="待填"></td>
                <td><input class="cell-input" value="OPP/CPP"></td>
                <td><input class="cell-input" value="500×320"></td>
                <td><input class="cell-input num" value="5100"></td>
                <td><input class="cell-input num" value="" placeholder="待填"></td>
                <td><input class="cell-input num" value="" placeholder="待填"></td>
                <td><input class="cell-input num" value=""></td>
                <td>
                  <select class="cell-select"><option selected>干式</option><option>无溶剂</option></select>
                </td>
                <td><input class="cell-input num" value=""></td>
                <td><input class="cell-input" value=""></td>
                <td><button class="row-del" title="删除该行"><svg width="15" height="15"><use href="icons.svg#i-trash"></use></svg></button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="form-foot">
          <span class="form-foot-sum">合计：实际复合 <b>10,770</b> m · 卷数 <b>37</b> 卷 · 调机损耗 <b>420</b> m（未含第 4 行）</span>
          <span class="toolbar" style="margin-left:auto">
            <button class="btn btn-ghost">存草稿</button>
            <button class="btn btn-primary"><svg width="15" height="15"><use href="icons.svg#i-check"></use></svg>提交日报</button>
          </span>
        </div>
      </section>

      <p class="card-sub" style="padding:0 4px">提示：调机米数为开机调试消耗的膜料，不计入实际复合产量；无溶剂机开工前需记录固化时间。</p>
    </main>
  </div>
</div>
</body>
</html>
