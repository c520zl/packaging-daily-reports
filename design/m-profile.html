<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="app">
<title>个人资料 · 软包装生产日报表系统</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mobile.css">
<style>
  .avatar-edit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 0 6px;
  }
  .avatar-big {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent-weak);
    color: #0A5E5D;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 600;
    position: relative;
  }
  .avatar-big .cam {
    position: absolute;
    right: 0; bottom: 0;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: grid; place-items: center;
    border: 2.5px solid var(--surface);
  }
  .avatar-big .cam svg { width: 13px; height: 13px; }
  .pwd-item { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
  .pwd-item + .pwd-item { border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="app with-submitbar">
  <header class="m-head-plain">
    <a class="m-back-plain" href="m-me.html">
      <svg width="18" height="18"><use href="icons.svg#i-arrow-right" transform="rotate(180 12 12)"></use></svg>
    </a>
    <div class="m-title">个人资料</div>
  </header>

  <main class="m-body">
    <section class="m-card">
      <div class="m-card-body" style="padding-top:0; padding-bottom:0">
        <div class="avatar-edit">
          <div class="avatar-big">李<div class="cam"><svg><use href="icons.svg#i-edit"></use></svg></div></div>
          <span style="font-size:12px; color:var(--muted)">点击更换头像（JPG/PNG，≤2MB）</span>
        </div>
      </div>
    </section>

    <section class="m-card">
      <div class="m-card-head"><div class="m-card-title">基本信息</div></div>
      <div class="m-card-body" style="padding-top:2px; padding-bottom:2px">
        <div class="m-field">
          <label class="m-label">用户名</label>
          <div class="m-calc">yinshua-02<span class="hint">不可修改</span></div>
        </div>
        <div class="m-field">
          <label class="m-label">姓名（签名用）<span class="req">*</span></label>
          <input class="m-input" type="text" value="李明">
        </div>
        <div class="m-field">
          <label class="m-label">性别</label>
          <div class="m-seg">
            <div class="m-seg-item on">男</div>
            <div class="m-seg-item">女</div>
          </div>
        </div>
        <div class="m-field">
          <label class="m-label">手机号<span class="req">*</span></label>
          <input class="m-input" type="tel" inputmode="numeric" value="138 0000 0003">
        </div>
        <div class="m-field">
          <label class="m-label">电子邮箱</label>
          <input class="m-input" type="email" value="liming@example.com">
        </div>
        <div class="m-field">
          <label class="m-label">住址</label>
          <input class="m-input" type="text" value="印刷车间宿舍 2 号楼">
        </div>
        <div class="m-field">
          <label class="m-label">部门 / 角色</label>
          <div class="m-calc">印刷部 · 普通员工<span class="hint">由管理员分配</span></div>
        </div>
      </div>
    </section>

    <section class="m-card">
      <div class="m-card-head"><div class="m-card-title">修改密码</div></div>
      <div class="m-card-body" style="padding-top:2px; padding-bottom:2px">
        <div class="pwd-item">
          <label class="m-label">原密码<span class="req">*</span></label>
          <input class="m-input" type="password" placeholder="请输入当前密码">
        </div>
        <div class="pwd-item">
          <label class="m-label">新密码<span class="req">*</span></label>
          <input class="m-input" type="password" placeholder="8 位以上，含字母和数字">
        </div>
        <div class="pwd-item">
          <label class="m-label">确认新密码<span class="req">*</span></label>
          <input class="m-input" type="password" placeholder="再次输入新密码">
        </div>
      </div>
    </section>
  </main>

  <div class="m-submitbar">
    <div class="sum">资料与密码修改后需重新验证</div>
    <button class="m-btn m-btn-primary m-btn-block" style="flex:1">保存</button>
  </div>
</div>
</body>
</html>
