<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="app">
<title>修改重报 · 软包装生产日报表系统</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mobile.css">
<style>
  .reject-banner {
    background: var(--danger-weak);
    border: 1px solid #F5C2C2;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 13.5px;
    color: #B91C1C;
    line-height: 1.7;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .reject-banner svg { flex-shrink: 0; margin-top: 2px; }
  .fixed-field { position: relative; }
  .fixed-field .fix-badge {
    position: absolute;
    right: 10px; top: -9px;
    font-size: 12px;
    background: var(--success);
    color: #fff;
    border-radius: 999px;
    padding: 1px 8px;
    font-weight: 500;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="app with-submitbar">
  <header class="m-head-plain">
    <a class="m-back-plain" href="m-records.html">
      <svg width="18" height="18"><use href="icons.svg#i-arrow-right" transform="rotate(180 12 12)"></use></svg>
    </a>
    <div class="m-title">修改重报 · YS-20261122-06</div>
    <span class="tag tag-red" style="margin-left:auto"><span class="dot"></span>已退回</span>
  </header>

  <main class="m-body">
    <!-- 退回原因 -->
    <div class="reject-banner">
      <svg width="15" height="15"><use href="icons.svg#i-bell"></use></svg>
      <span><b>陈机长</b> 于 11-23 09:12 退回：<br>「实际印刷米数漏填，请补填后重新提交。」</span>
    </div>

    <!-- 原单内容（只读 + 补填项高亮） -->
    <section class="m-card">
      <div class="m-card-head"><div class="m-card-title">原单内容</div><div class="m-card-sub" style="margin-left:auto">11-22 白班 · NY/PE</div></div>
      <div class="m-card-body" style="padding-top:2px; padding-bottom:2px">
        <div class="m-field">
          <label class="m-label">尺寸规格</label>
          <div class="m-calc">420×300 mm<span class="hint">不可修改</span></div>
        </div>
        <div class="m-field">
          <label class="m-label">要求印刷米数</label>
          <div class="m-calc">4,500 m<span class="hint">不可修改</span></div>
        </div>
        <div class="m-field">
          <label class="m-label">实际印刷米数<span class="req">*</span></label>
          <div class="fixed-field">
            <span class="fix-badge">本次补填</span>
            <input class="m-input num" type="number" inputmode="numeric" placeholder="请补填实际印刷米数">
          </div>
        </div>
        <div class="m-field">
          <label class="m-label">补充说明</label>
          <textarea class="m-textarea" placeholder="可说明当时漏填原因"></textarea>
        </div>
      </div>
    </section>

    <p class="m-card-sub" style="padding:0 4px">重新提交后将再次进入陈机长的审核列表；本单的退回与修改记录全程留痕。</p>
  </main>

  <div class="m-submitbar">
    <div class="sum">补填 <b>1</b> 个字段后重报</div>
    <button class="m-btn m-btn-outline">存草稿</button>
    <a class="m-btn m-btn-primary" href="m-success.html">重新提交</a>
  </div>
</div>
</body>
</html>
