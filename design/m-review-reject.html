<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dsh-design" content="app">
<title>退回原因 · 软包装生产日报表系统</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mobile.css">
<style>
  .reject-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .reject-chip {
    height: 38px;
    padding: 0 14px;
    display: inline-flex; align-items: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    font-size: 13.5px;
    color: var(--muted);
    background: var(--surface);
    cursor: pointer;
  }
  .reject-chip.on {
    background: var(--danger-weak);
    border-color: var(--danger);
    color: #B91C1C;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="app with-submitbar">
  <header class="m-head-plain">
    <a class="m-back-plain" href="m-review.html">
      <svg width="18" height="18"><use href="icons.svg#i-arrow-right" transform="rotate(180 12 12)"></use></svg>
    </a>
    <div class="m-title">退回 · YS-20261123-05</div>
  </header>

  <main class="m-body">
    <section class="m-card">
      <div class="m-card-body" style="padding-top:2px; padding-bottom:2px">
        <div class="m-field">
          <label class="m-label">常见原因（点选）</label>
          <div class="reject-chips">
            <span class="reject-chip on">机速 / 实际米数漏填</span>
            <span class="reject-chip">米数与机台记录不符</span>
            <span class="reject-chip">袋型 / 规格选错</span>
            <span class="reject-chip">废料 kg 数异常</span>
            <span class="reject-chip">签名字段空缺</span>
            <span class="reject-chip">其他</span>
          </div>
        </div>
        <div class="m-field">
          <label class="m-label">退回说明<span class="req">*</span></label>
          <textarea class="m-textarea" style="min-height:96px">机速与实际印刷米数未填写，请下班前补填后重新提交。</textarea>
        </div>
        <div class="m-field">
          <label class="m-label">同时通知</label>
          <div style="display:flex; align-items:center; gap:10px; font-size:14px">
            <span class="checkbox" style="width:18px; height:18px; border:1.5px solid var(--primary); background:var(--primary); border-radius:4px; position:relative; display:inline-block"></span>
            <span style="position:relative; display:inline-flex">
              <svg width="14" height="14" style="position:absolute; left:2.5px; top:1.5px; color:#fff"><use href="icons.svg#i-check"></use></svg>
            </span>
            站内通知 + 短信提醒员工（李明 · 138 0000 0003）
          </div>
        </div>
      </div>
    </section>

    <p class="m-card-sub" style="padding:0 4px">退回后该行回到员工「待修改」列表，员工补填重新提交后会再次进入您的审核列表，全部留痕可查。</p>
  </main>

  <div class="m-submitbar">
    <div class="sum">退回后员工需修改重报</div>
    <button class="m-btn m-btn-outline">取消</button>
    <a class="m-btn m-btn-primary" href="m-review.html" style="background:var(--danger)">确认退回</a>
  </div>
</div>
</body>
</html>
